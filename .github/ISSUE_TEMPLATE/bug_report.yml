name: Bug report
description: Report something that does not work as described.
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: chapter
    attributes:
      label: Chapter
      options:
        - "Chapter 0: environment"
        - "Chapter 1: text data and tokenization"
        - "Chapter 2: self-attention"
        - "General / other"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you run?
      description: The file or notebook, and the exact command or cells.
      placeholder: python -m chap1.tokenize_text --url https://example.com
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what did you expect?
      description: Include the full error message.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your operating system and machine, and the output of `python -m chap0.check_environment`.
      render: text
    validations:
      required: true
